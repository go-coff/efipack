name: CI

# Build + RUN the test suite on every 64-bit arch efipack targets
# (amd64, arm64, riscv64, loong64, ppc64le, s390x), not just amd64.
#
# Why this matters here: efipack reads and writes the PE/COFF (EFI) on-disk
# format, which is LITTLE-ENDIAN. The parser uses explicit
# binary.LittleEndian throughout, so running the suite on s390x (big-endian
# hardware) under QEMU is a genuine endianness check, not a formality.
#
# Native runners cover amd64 (ubuntu-latest) and arm64 (ubuntu-24.04-arm).
# The remaining little-endian arches plus big-endian s390x run as
# cross-compiled test binaries under QEMU via tonistiigi/binfmt.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + the canonical amd64 test run with the repo's 95% coverage gate.
  test:
    name: gofmt + vet + 95% coverage (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - run: go version

      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Enforce 95% coverage
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d %)
          awk -v p="$pct" 'BEGIN { if (p+0 < 95.0) { printf "coverage is %s%%, want >= 95%%\n", p; exit 1 } }'

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # Native arm64 run on a real arm64 runner.
  test-arm64:
    name: test (arm64, native)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - run: go version

      - name: go test
        run: go test ./...

  # Cross-compiled test binaries run under QEMU for the remaining 64-bit
  # arches. s390x is BIG-ENDIAN — the real cross-arch validation of the
  # little-endian PE/COFF codec. No fuzzing runs here (fuzz is native-only).
  emulated:
    name: test (${{ matrix.arch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: power9
          - arch: s390x
            image: debian:trixie
            qemu_cpu: qemu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - run: go version

      - name: register QEMU binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      # Compile one cover-instrumented test binary per package for the target
      # arch, then execute each under QEMU. This RUNS the suite (not just a
      # build) so endianness/word-size bugs surface — notably on big-endian
      # s390x for the little-endian PE/COFF codec. CGO is off so the binaries
      # are statically linked and run cleanly under emulation.
      - name: cross-compile test binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p _qemu
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/.' '__')
            if go test -c -cover -o "_qemu/${name}.test" "$pkg"; then
              echo "built ${name}.test for $pkg"
            else
              # Packages with no test files emit no binary; that's fine.
              echo "no test binary for $pkg (no tests?)"
            fi
          done

      - name: run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(_qemu/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::no test binaries were built for ${{ matrix.arch }}"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            echo "::group::$bin (${{ matrix.arch }})"
            docker run --rm \
              --platform "linux/${{ matrix.arch }}" \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD:/work" -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v
            echo "::endgroup::"
          done
